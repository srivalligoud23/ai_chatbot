<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .chat-container {
            width: 400px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .header {
            background: #4f46e5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-box {
            height: 350px;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
        }

        .user {
            background: #e0e7ff;
            text-align: right;
        }

        .bot {
            background: #f1f5f9;
        }

        form {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            margin-left: 10px;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h2>🤖 AI Chatbot</h2>
        <p>Ask me anything!</p>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">
            Hello! 👋 How can I help you?
        </div>
    </div>

    <form id="chatForm">
        <input
            type="text"
            id="message"
            placeholder="Type your message..."
            required
        >

        <button type="submit">Send</button>
    </form>

</div>

<script>
    document.getElementById("chatForm").addEventListener("submit", async function(event) {
        event.preventDefault();

        const input = document.getElementById("message");
        const chatBox = document.getElementById("chatBox");

        const message = input.value;

        // Display user message
        chatBox.innerHTML += `
            <div class="message user">
                ${message}
            </div>
        `;

        input.value = "";

        // Send message to Flask
        const response = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: "message=" + encodeURIComponent(message)
        });

        const botResponse = await response.text();

        // Display bot response
        chatBox.innerHTML += `
            <div class="message bot">
                ${botResponse}
            </div>
        `;

        chatBox.scrollTop = chatBox.scrollHeight;
    });
</script>

</body>
</html>
